settings:
  experiment_id: ${modalities_env:experiment_id}
  data_dir_cc: ${oc.env:DATA_DIR_CC}
  data_dir_math: ${oc.env:DATA_DIR_MATH}
  checkpoint_saving_path: ${oc.env:CHECKPOINT_SAVING_PATH}
  wandb_mode: ${oc.env:WANDB_MODE_M}
  wandb_path: ${oc.env:WANDB_PATH_M}
  config_file_path: ${modalities_env:config_file_path}
  referencing_keys:
    sample_key: input_ids
    target_key: target_ids
    prediction_key: logits
  cuda_env:
    local_rank: ${cuda_env:LOCAL_RANK}
    global_rank: ${cuda_env:RANK}
    world_size: ${cuda_env:WORLD_SIZE}
  paths:
    checkpoint_saving_path: ${settings.checkpoint_saving_path}
    train_dataset_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_24_eval.pbin
  intervals:
    training_log_interval_in_steps: 10
    checkpointing_interval_in_steps: 9288 # 3 checkpoints
    evaluation_interval_in_steps: 9288 # 3 evaluations
  consistency_enforcement:
    enforce_tokens_per_step_consistency: true
    enforce_last_step_logged: false
    enforce_last_step_evaluated: false
    enforce_last_step_checkpointed: false
  step_profile:
    gradient_accumulation_steps: 1
    local_train_micro_batch_size: 1
    sequence_length: 2048
    dp_degree:
      instance_key: dp_degree
      pass_type: BY_REFERENCE
  training_target: 
    num_target_tokens: 6_848_839_680 # 27868 x 2048 x 120
    num_target_steps:
      component_key: number_conversion
      variant_key: num_steps_from_num_tokens
      config:
        dp_degree:
          instance_key: dp_degree
          pass_type: BY_REFERENCE
        local_micro_batch_size: ${settings.step_profile.local_train_micro_batch_size}
        global_num_tokens: ${settings.training_target.num_target_tokens}
        sequence_length: ${settings.step_profile.sequence_length}
        gradient_accumulation_steps: ${settings.step_profile.gradient_accumulation_steps}
  training_progress:
    global_num_seen_tokens: 0
    num_seen_steps: 0
    num_seen_samples: 0
    last_step: -1

collate_fn:
  component_key: collate_fn
  variant_key: gpt_2_llm_collator
  config:
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

train_dataset:
  component_key: dataset
  variant_key: combined
  config:
    datasets:
    - component_key: dataset
      variant_key: packed_mem_map_dataset_continuous
      config:
        raw_data_path: ${settings.data_dir_math}/Nemotron-CC-Math-v1_train_4plus_part18_eval.pbin
        sequence_length: ${settings.step_profile.sequence_length}
        sample_key:  ${settings.referencing_keys.sample_key}
    - component_key: dataset
      variant_key: packed_mem_map_dataset_continuous
      config:
        raw_data_path: ${settings.data_dir_math}/Nemotron-CC-Math-v1_train_4plus_part19_eval.pbin
        sequence_length: ${settings.step_profile.sequence_length}
        sample_key:  ${settings.referencing_keys.sample_key}    
    
    - component_key: dataset
      variant_key: packed_mem_map_dataset_continuous
      config:
        raw_data_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_21.pbin
        sequence_length: ${settings.step_profile.sequence_length}
        sample_key:  ${settings.referencing_keys.sample_key}
    - component_key: dataset
      variant_key: packed_mem_map_dataset_continuous
      config:
        raw_data_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_23_eval.pbin
        sequence_length: ${settings.step_profile.sequence_length}
        sample_key:  ${settings.referencing_keys.sample_key}


train_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: train
    dataset:
      instance_key: train_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: ${settings.step_profile.local_train_micro_batch_size}
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: resumable_distributed_sampler
          config:
            dataset:
              instance_key: train_dataset
              pass_type: BY_REFERENCE
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: true
            seed: 42
            drop_last: true
            skip_num_global_samples: ${settings.training_progress.num_seen_samples}
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE

test_dataset:
  component_key: dataset
  variant_key: combined
  config:
    datasets:
    - component_key: dataset
      variant_key: packed_mem_map_dataset_continuous
      config:
        raw_data_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_23_part_00_SMALL_EVAL.pbin
        sequence_length: ${settings.step_profile.sequence_length}
        sample_key:  ${settings.referencing_keys.sample_key}
    # - component_key: dataset
    #   variant_key: packed_mem_map_dataset_continuous
    #   config:
    #     raw_data_path: ${settings.data_dir_cc}/Nemotron-CC-highQuality-sampled_data_part_23_part_00_SMALL_EVAL.pbin
    #     sequence_length: ${settings.step_profile.sequence_length}
    #     sample_key:  ${settings.referencing_keys.sample_key}

test_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: test
    dataset:
      instance_key: test_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: 8
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: test_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE


eval_dataloaders:
  - instance_key: test_dataloader
    pass_type: BY_REFERENCE

checkpoint_saving:
  component_key: checkpoint_saving
  variant_key: default
  config:
    checkpoint_saving_strategy:
      component_key: checkpoint_saving_strategy
      variant_key: save_k_most_recent_checkpoints_strategy
      config:
        k: -1
    checkpoint_saving_execution:
      component_key: checkpoint_saving_execution
      variant_key: dcp
      config:
        checkpoint_path: ${settings.paths.checkpoint_saving_path}
        global_rank: ${settings.cuda_env.global_rank}
        experiment_id: ${settings.experiment_id}

loss_fn:
  component_key: loss
  variant_key: clm_recurrence_cosine_sim_penalty_loss
  config:
    target_key: ${settings.referencing_keys.target_key}
    prediction_key: ${settings.referencing_keys.prediction_key}
    penalty_alpha: 0


device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: -1
    world_size: ${settings.cuda_env.world_size}

dp_degree:
  component_key: number_conversion
  variant_key: parallel_degree
  config:
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    parallelism_methods: [dp_shard, dp_replicate]

app_state:
  component_key: app_state
  variant_key: raw
  config:
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    lr_scheduler:
      instance_key: lr_scheduler
      pass_type: BY_REFERENCE
    

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: fsdp_model
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: gpt2
        weight_init_type: scaled
        mean: 0.0
        std: 0.02
        num_layers: ${model_raw.config.n_layer}

fsdp_model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      # instance_key: compiled_model
      instance_key: model_raw
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: BF_16
      reduce_dtype: BF_16
    block_names: [GPT2Block]

# compiled_model:
#   component_key: model
#   variant_key: compiled
#   config:
#     model:
#       instance_key: model_raw
#       pass_type: BY_REFERENCE
#     block_names: [GPT2Block]

model_raw:
  component_key: model
  variant_key: gpt2
  config:
    use_meta_device: false
    sample_key: ${settings.referencing_keys.sample_key}
    poe_type: NOPE
    sequence_length: ${settings.step_profile.sequence_length}
    prediction_key: ${loss_fn.config.prediction_key}
    vocab_size: 50304 # GPT-2 vocab_size of 50257, padded up to nearest multiple of 64 for efficiency
    n_layer: 12
    n_head_q: 32
    n_head_kv: 32
    ffn_hidden: 4352
    n_embd: 1024
    dropout: 0.0
    bias: false
    attention_config:
      qkv_transforms:
        - type_hint: RotaryTransform
          config:
            n_embd: ${model_raw.config.n_embd}
            n_head: ${model_raw.config.n_head_q} #it has to be head_q here
            seq_length_dim: -2
            base_freq: 10000
      qk_norm_config:
        norm_type: pytorch_rms_norm
        config:
          normalized_shape: 32 # n_embd / n_head
          eps: 1.0e-05
    attention_implementation: pytorch_flash
    activation_type: swiglu
    attention_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    ffn_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    lm_head_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1.0e-05
    use_weight_tying: false
    use_LNS: true
    track_recurrence_embd_similarity: true

lr_scheduler:
  component_key: scheduler
  variant_key: onecycle_lr
  config:
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    max_lr: 0.0019
    cycle_momentum: false
    div_factor: 10
    final_div_factor: 1
    total_steps: ${settings.training_target.num_target_steps}
    pct_start: 0.001
    anneal_strategy: cos
    last_epoch: ${settings.training_progress.last_step}


optimizer:
  component_key: optimizer
  variant_key: muon
  config:
    lr: 0.0019
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1e-8
    weight_decay: 0.2
    weight_decay_groups_excluded: [embedding, layernorm, pytorch_rms_norm]
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE

gradient_clipper:
  component_key: gradient_clipper
  variant_key: fsdp2
  config:
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    norm_type: P2_NORM
    max_norm: 1.0
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE

progress_subscriber:
  component_key: progress_subscriber
  variant_key: rich
  config:
    global_rank: ${settings.cuda_env.global_rank}
    num_seen_steps: ${settings.training_progress.num_seen_steps}
    num_target_steps: ${settings.training_target.num_target_steps}
    train_dataloader_tag: ${train_dataloader.config.dataloader_tag}
    eval_dataloaders:
      instance_key: eval_dataloaders
      pass_type: BY_REFERENCE

evaluation_subscriber:
  component_key: results_subscriber
  variant_key: wandb
  config:
    global_rank: ${settings.cuda_env.global_rank}
    project: loop_MTP_paper
    mode: ${settings.wandb_mode}
    experiment_id: 266M_BASELINE_k=${model_raw.config.n_layer}_${settings.experiment_id}
    tags: [BASELINE]
    directory: ${settings.wandb_path}
    config_file_path: ${settings.config_file_path}