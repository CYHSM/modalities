bind_3_dataset:
  component_key: dataset
  variant_key: synthetic_reasoning
  config:
    task: variable_binding
    num_samples: 2048
    num_hops: 3
    # The answer is always a symbol that appears as a value but never as a variable, and there are
    # exactly num_distractors + 1 of those -- so a model that has learned only the *format* reaches
    # 1/(num_distractors + 1) without following the chain. Read bind_3 accuracy against 1/10 = 0.10,
    # NOT against the 1/26 that applies to the p_hop tasks. 9 is the largest value that still leaves
    # slack in a 26-symbol alphabet: 3 chain variables + 1 literal + 2*9 distractor symbols = 22.
    num_distractors: 9
    seed: 1234
    symbol_token_ids: *reasoning_alphabet
    # ' ;' separates statements, ' =' is the assignment operator.
    delimiter_token_ids: [2162, 796]
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

bind_3_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: bind_3
    dataset:
      instance_key: bind_3_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: 64
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: bind_3_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: masked_target_collate_fn
      pass_type: BY_REFERENCE

# ----------------------------------------------------------------------------------------------
# BENCHMARK EVALUATIONS: MINERVA MATH (reasoning) AND TRIVIAQA (parametric-knowledge control)
#
# These two are read against each other. The claim about looped models is that weight sharing buys
# reasoning without buying parameters, so they should move in OPPOSITE directions: looping is
# expected to help on math and to be neutral or worse on closed-book recall, whose knowledge lives
# in weights a loop does not add. Showing that dissociation is what makes a win on math credible
# rather than an artifact of an arm simply training better.
#
# Negative log-likelihood, not accuracy: at 1.1B parameters and a few billion tokens a model scores
# ~zero on both, so solve rate is a constant, not a measurement. The likelihood assigned to the
# CORRECT answer is graded and moves long before accuracy leaves the floor. Only `answer_nll` is
# meaningful here -- `answer_accuracy` is per-token next-token accuracy over a reference solution
# and is reported for completeness, not as a benchmark score.
#
# `minerva_math` is the lm-evaluation-harness `minerva_math` task, not plain Hendrycks MATH: same
# test split, but Minerva's "Problem:\n{problem}\n\nSolution:" prompt and its verbatim 4-shot
# prefix. Minerva's SymPy answer checking only scores a *generated* answer for exact match and has
# no counterpart in a likelihood evaluation.
#
# Both are tokenized ONCE, offline, so every arm is scored on byte-identical token sequences and
# training needs no tokenizer. Build them before the first run:
#   python config_files/nemotron/loop_ablation/prepare_text_evals.py
# minerva_math: 1024 problems, 214 scored tokens each. triviaqa: 8192 questions, 3.0 each.
# ----------------------------------------------------------------------------------------------

minerva_math_dataset:
  component_key: dataset
  variant_key: prepared_eval
  config:
    prepared_path: data/prepared_evals_gpt2/minerva_math.npz
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

minerva_math_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: minerva_math
    dataset:
      instance_key: minerva_math_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        # These sequences run to 1997 tokens (the 4-shot prefix is ~500), so the logits tensor is
        # the same size as the language-modelling split's at batch 8 -- about 3.9 GiB in bf16 at
        # a 128k vocab -- and the metric copies the scored rows on top of that. Batch 4 keeps this
        # evaluation's peak strictly below the `test` split's, so attaching it cannot make an arm
        # OOM that previously fit. N2_anchor_moe already peaks at 47.8 GiB.
        batch_size: 4
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: minerva_math_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: masked_target_collate_fn
      pass_type: BY_REFERENCE

triviaqa_dataset:
  component_key: dataset
  variant_key: prepared_eval
  config:
    prepared_path: data/prepared_evals_gpt2/triviaqa.npz
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

triviaqa_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 0
    pin_memory: true
    dataloader_tag: triviaqa
    dataset:
      instance_key: triviaqa_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        # 142 tokens per question, so a large batch costs little.
        batch_size: 64
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: triviaqa_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: masked_target_collate_fn
      pass_type: BY_REFERENCE

eval_dataloaders:
  - instance_key: test_dataloader
    pass_type: BY_REFERENCE
  - instance_key: p_hop_1_dataloader
    pass_type: BY_REFERENCE
  - instance_key: p_hop_2_dataloader
    pass_type: BY_REFERENCE
  - instance_key: p_hop_3_dataloader
    pass_type: BY_REFERENCE
  - instance_key: bind_3_dataloader
    pass_type: BY_REFERENCE
  - instance_key: minerva_math_dataloader
    pass_type: BY_REFERENCE
  - instance_key: triviaqa_dataloader
    pass_type: BY_REFERENCE

# Reported per dataloader as "<dataloader_tag> <tag>" in wandb, e.g. "p_hop_3 answer_accuracy".
# Restricted to the synthetic dataloaders by tag: on the language-modelling `test` split no target
# is masked, so an "answer accuracy" there would be next-token accuracy over ordinary text, which
# is a different quantity wearing the same name.
eval_metrics:
  - component_key: evaluation_metric
    variant_key: masked_token_accuracy
    config:
      tag: answer_accuracy
      target_key: ${settings.referencing_keys.target_key}
      prediction_key: ${settings.referencing_keys.prediction_key}
      dataloader_tags: &reasoning_dataloader_tags
        [p_hop_1, p_hop_2, p_hop_3, bind_3, minerva_math, triviaqa]
  # Accuracy is pinned at chance until the model can do the task at all; the answer's negative
  # log-likelihood moves before that and is what to watch early in a run.
  - component_key: evaluation_metric
    variant_key: masked_token_nll
    config:
      tag: answer_nll
      target_key: ${settings.referencing_keys.target_key}
      prediction_key: ${settings.referencing_keys.prediction_key}
      dataloader_tags: *reasoning_dataloader_tags

checkpoint_saving:
  component_key: checkpoint_saving
  variant_key: default
  config:
    checkpoint_saving_strategy:
      component_key: checkpoint_saving_strategy
      variant_key: save_k_most_recent_checkpoints_strategy
      config:
        k: 1
    checkpoint_saving_execution:
      component_key: checkpoint_saving_execution
      variant_key: dcp
      config:
        checkpoint_path: ${settings.paths.experiments_root_path}/${settings.experiment_id}/checkpoints
        global_rank: ${settings.cuda_env.global_rank}
        experiment_id: ${settings.experiment_id}

loss_fn:
  component_key: loss
  variant_key: weighted_sum
  config:
    weights: [1.0, 1.0]
    losses:
      - component_key: loss
        variant_key: clm_cross_entropy_loss
        config:
          target_key: ${settings.referencing_keys.target_key}
          prediction_key: ${settings.referencing_keys.prediction_key}
      - component_key: loss
        variant_key: moe_aux_loss
        config:
          prediction_key: moe_aux_loss

device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    # Pure replicate (DDP-like), not FSDP sharding: at 1.1-2.0B parameters the unsharded model
    # comfortably fits a 64 GiB A100 (peak measured ~48 GiB for the largest arm, N2_anchor_moe),
    # so sharding buys nothing but an all-gather per forward -- and section 9.8 of the research
    # plan notes FSDP2 reshards a looped block after every iteration, which is a real cost for the
    # loop arms specifically. world_size is set by --nproc_per_node x --nnodes at launch (4, one
    # node); every arm in the wave must use the same value, see the step_profile comment above.
    data_parallel_replicate_degree: 4
    data_parallel_shard_degree: 1
    world_size: ${settings.cuda_env.world_size}

dp_degree:
  component_key: number_conversion
  variant_key: parallel_degree
  config:
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    parallelism_methods: [dp_shard, dp_replicate]

checkpoint_loading:
  component_key: checkpoint_loading
  variant_key: dcp
  config:
    global_rank: ${settings.cuda_env.global_rank}

app_state:
  component_key: app_state
  variant_key: dcp
  config:
    raw_app_state:
      instance_key: app_state_raw
      pass_type: BY_REFERENCE
    checkpoint_dir_path: ${settings.warmstart_checkpoint_paths.checkpoint_folder_path}

app_state_raw:
  component_key: app_state
  variant_key: raw
  config:
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    lr_scheduler:
      instance_key: lr_scheduler
      pass_type: BY_REFERENCE

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: fsdp_model
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: nemotron
        weight_init_type: scaled
        mean: 0.0
        std: auto
        hidden_dim: ${model_raw.config.n_embd}
        # Effective depth, NOT n_layer: residual variance grows with the number of layer
        # applications, so a looped arm must be initialized for its executed depth. Derived
        # from the pattern so that changing the pattern cannot leave this stale -- otherwise
        # loop arms are systematically mis-initialized and the difference reads as a loop effect.
        num_layers:
          component_key: number_conversion
          variant_key: num_executed_layers_from_layer_pattern
          config:
            layer_pattern: ${model_raw.config.layer_pattern}

fsdp_model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      instance_key: activation_checkpointed_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: BF_16
      reduce_dtype: FP_32
    layers_per_fsdp_unit: 1
    block_names: [Mamba2Layer, NemotronMoELayer, NemotronAttentionLayer, NemotronMLPLayer]

activation_checkpointed_model:
  component_key: model
  variant_key: activation_checkpointed
  config:
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    ac_variant: full_activation_checkpointing
    layers_fqn: transformer.h
    ac_fun_params: {}

model_raw:
  component_key: model
  variant_key: nemotron
  config:
    # Weight tying is not supported on the meta device, and tying is what keeps the embedding
    # table at 131M instead of 263M. At 1.1B, building on CPU first is cheap enough.
    use_meta_device: false
    sample_key: ${settings.referencing_keys.sample_key}
    prediction_key: ${settings.referencing_keys.prediction_key}
    aux_loss_key: moe_aux_loss
    sequence_length: ${settings.step_profile.sequence_length}
    vocab_size: 50304
    # n_layer counts BUILT layers: a loop group's layers are built once, not once per
    # iteration. Keep in sync with layer_pattern; the model validates it.
    n_layer: 12
    layer_pattern: "ME[M*]^3EMEME[M*]^3E"
    loop_config:
      # "simple": each loop iteration consumes the previous one's output. The planned
      # router-weighted variant (weighted sum over iterations) plugs in here.
      variant: simple
      # Both refinements below default to false, which is the clean weight-sharing-only arm.
      # They are varied by the A2* arms so that the loop effect and the conditioning effect stay
      # separable; see docs/components/nemotron_loops.md#per-iteration-norms-and-input-injection.
      #
      # Each loop iteration gets its own pre-norm. Adds (K-1) * n_embd parameters per looped
      # layer, so such an arm is no longer *exactly* iso-parameter with the baseline.
      per_iteration_norm: false
      # The group's input is added back before every iteration after the first. No parameters.
      input_injection: false
    use_weight_tying: true
    lm_head_norm_config: &nemotron_norm_config
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
    n_embd: 1024
    layer_specs:
      "M":
        component_key: nemotron_layer_spec
        variant_key: mamba2
        config:
          n_embd: ${model_raw.config.n_embd}
          # d_inner = 24*64 = 1536 = 1.5 * n_embd, matching the reference's 4096/2688.
          mamba_n_heads: 24
          mamba_head_dim: 64
          mamba_state_dim: 128
          mamba_n_groups: 4
          d_conv: 4
          chunk_size: 128
          ssd_backend: fused
          norm_config: *nemotron_norm_config
      "E":
        component_key: nemotron_layer_spec
        variant_key: moe
        config:
          n_embd: ${model_raw.config.n_embd}
          # 128 experts of 704 = 0.69 * n_embd, top-6: the reference's sparsity exactly.
          num_experts: 128
          moe_ffn_hidden: 704
          top_k: 6
          route_scale: 2.5
          score_function: sigmoid
          use_expert_bias: true
          router_dtype: float32
          num_shared_experts: 2
          shared_expert_ffn_hidden_per_expert: 704
          aux_loss_coeff: 1.0e-4
          experts_backend: grouped_mm
          norm_config: *nemotron_norm_config
      "*":
        component_key: nemotron_layer_spec
        variant_key: attention
        config:
          n_embd: ${model_raw.config.n_embd}
          # 12*128 = 1536 = 1.5 * n_embd: the reference deliberately overprovisions attention
          # relative to the model dimension (32*128 != 2688), and that ratio is preserved.
          n_head_q: 12
          n_head_kv: 1
          head_dim: 128
          attention_implementation: pytorch_flash
          norm_config: *nemotron_norm_config

lr_scheduler:
  component_key: scheduler
  variant_key: linear_warmup_cosine_annealing_lr
  config:
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    warmup_steps: 1500
    # Follows num_target_steps (8500), which is now a literal chosen to match the wall-clock budget
    # rather than the size of the training file. See the comment there: when this was 30,517 the
    # cosine never decayed within a run and every arm plateaued at the peak-LR floor.
    total_steps: ${settings.training_target.num_target_steps}
    initial_lr: 4.5e-5
    max_lr: 4.5e-4
    final_lr: 4.5e-5

optimizer:
  component_key: optimizer
  variant_key: moe_load_balanced
  config:
    expert_bias_update_rate: 1.0e-3
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    optimizer:
      component_key: optimizer
      variant_key: adam_w
      config:
        lr: 4.5e-4
        betas: [0.9, 0.95]
        eps: 1e-8
        weight_decay: 0.1
        weight_decay_groups_excluded: [embedding, layernorm, ssm, router]
        wrapped_model:
          instance_key: initialized_model
          pass_type: BY_REFERENCE

gradient_clipper:
  component_key: gradient_clipper
  variant_key: fsdp2
  config:
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    norm_type: P2_NORM
    max_norm: 1.0
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE

progress_subscriber:
  component_key: progress_subscriber
  variant_key: rich
  config:
    global_rank: ${settings.cuda_env.global_rank}
    num_seen_steps: ${settings.training_progress.num_seen_steps}
    num_target_steps: ${settings.training_target.num_target_steps}
    train_dataloader_tag: ${train_dataloader.config.dataloader_tag}
    eval_dataloaders:
      instance_key: eval_dataloaders
      pass_type: BY_REFERENCE

evaluation_subscriber:
  component_key: results_subscriber
  variant_key: wandb
  config:
    global_rank: ${settings.cuda_env.global_rank}
    project: modalities_nemotron_loops_5b_cluster
    mode: OFFLINE
    experiment_id: ${settings.experiment_id}
    directory: ${settings.paths.experiments_root_path}/wandb
    config_file_path: ${settings.config_file_path}

mfu_calculator:
  component_key: mfu_calculator
  variant_key: nemotron
  config:
    # count_layers_by_type counts loop iterations, so the quadratic attention term is correct
    # for looped attention; active parameters are execution-weighted from the model itself.
    layer_pattern: ${model_raw.config.layer_pattern}
    sequence_length: ${settings.step_profile.sequence_length}
    n_embd: ${model_raw.config.n_embd}
    n_head_q: 12
    head_dim: 128
    world_size: ${settings.cuda_env.world_size}
    model_parts:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
