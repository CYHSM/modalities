#       --last_checkpoint_info_file_path <path to that run's last_checkpoint_info.json>

# ================================================================================================
# ABLATION ARM: A5_loop_mamba_attention
# Both Mamba+attention pairs run 3x. Local mixing followed by global attention, repeated.
#
#   layer_pattern : ME[M*]^3EMEME[M*]^3E
#   built layers  : 12   (sets of weights)
#   executed      : 20   layer applications per token
#   executions    : 9 Mamba / 5 MoE / 6 attention
#
# GENERATED FILE -- do not edit. Edit the base config and re-run
# config_files/nemotron/loop_ablation/generate_arm_configs.py.
# ================================================================================================
# Nemotron research-scale config for layer-loop ablations -- 5B-TOKEN CLUSTER WAVE.
#
# PURPOSE
# A small Nemotron that preserves the *cost structure* of Nemotron-3 Nano 30B-A3B, so that
# conclusions about where to spend depth (loop M vs E vs * vs [ME] vs [M*]) transfer. The
# two properties that had to be faithful are:
#
#   non-embedding active/total   9.7%  (reference: 9.3%)
#   per-layer active cost M:*:E  1 : 0.59 : 2.01  (reference: 1 : 0.60 : 2.07)
#
# Obtained by geometric scale-down of the published hyperparameters: n_embd 2688 -> 1024,
# 52 -> 12 layers, every ratio (mamba d_inner/d = 1.5, attention inner/d = 1.5, expert
# ffn/d = 0.69, top-6 of 128) held fixed. 1.105B total / 225M active.
#
# The headline 20.4% active (vs the reference's 11.3%) is entirely the vocabulary tax, though at a
# smaller magnitude than the Llama-3 wave: this config's tied GPT-2 embeddings are 51.5M, i.e. 5.2%
# of this model. That term is a constant added to every ablation arm and cancels in the comparison.
#
# WHAT CHANGED FROM config_research_nemotron_loops_1gpu.yaml (the 557M-token, Llama-3-tokenizer wave)
# See docs/components/nemotron_loops_research_plan.md section 9 for the full handoff. Summary:
#   - Dataset: the score3.0-3.5/3.5-4.0/4.0-4.5/4.5+ FineWeb-edu buckets (GPT-2 BPE tokenizer),
#     504 shards for train, 8 shards (2 per bucket) held out for test -- disjoint, unlike the
#     model-test example config this was adapted from, which reused a training shard as its eval set.
#   - vocab_size 128256 -> 50304, and every tokenizer-dependent eval asset (reasoning-eval symbol
#     and delimiter token ids, the Minerva-MATH/TriviaQA prepared .npz files) regenerated against
#     /leonardo_work/EUHPC_D21_101/mfrey/tokenizer/local_gpt2_tokenizer/.
#   - Budget: 557,056,000 -> 4,997,120,000 tokens (8500 -> 76,250 steps), warmup 750 -> 1500 steps.
#   - checkpointing_interval_in_steps: 50000 (never fired) -> 5000. No run in the 557M wave ever
#     saved a checkpoint; at 5B tokens no single run finishes inside one scheduler slot, so
#     checkpoint + warmstart is required, not optional.
#   - wandb: OFFLINE (compute nodes have no internet), synced from the login node afterward --
#     see config_files/nemotron/loop_ablation_5b_cluster/sync_wandb.sh.
#   - `step_profile` and `device_mesh` are the ONE thing this file leaves for the cluster-specific
#     wrapper to set: local_train_micro_batch_size x gradient_accumulation_steps x dp_degree x 2048
#     must equal 65,536 (matching num_target_tokens/num_target_steps above) however many GPUs an
#     arm runs on, and every arm in the wave must use the *same* dp_degree, or they stop reading
#     data in the same order and the matched-step comparison breaks. See run_wave_5b.sh.
#
# RUNNING THE ABLATION
# This file is the BASE / TEMPLATE, identical to the A0_baseline arm. The eleven arms this wave
# runs (A0-A6, N1-N4; the dense baselines and the per-iteration-norm 2x2 are not part of this wave,
# see section 9.6/9.7 of the research plan) are generated from it into
# config_files/nemotron/loop_ablation_5b_cluster/ by
#
#   python config_files/nemotron/loop_ablation_5b_cluster/generate_arm_configs.py
#
# Change a shared setting HERE and regenerate, so the arms cannot drift apart. Only `layer_pattern`
# and `n_layer` differ between arms; `num_layers` for the initializer is derived from the pattern,
# so effective depth never goes stale. The arm table and the reasoning are in
# docs/components/nemotron_loops.md.
#
# Use one virtual environment for both `torchrun` and `modalities`. Install fused Mamba kernels
# with `pip install -e '.[mamba]'` and keep `ssd_backend: fused`; switch to `native` if unavailable.

settings:
  experiment_id: A5_loop_mamba_attention_seed2
  config_file_path: ${modalities_env:config_file_path}
  referencing_keys:
    sample_key: input_ids
    target_key: target_ids
    prediction_key: logits
  cuda_env:
    local_rank: ${cuda_env:LOCAL_RANK}
    global_rank: ${cuda_env:RANK}
    world_size: ${cuda_env:WORLD_SIZE}
  paths:
    experiments_root_path: ${modalities_env:experiments_root_path}
  intervals:
    training_log_interval_in_steps: 5
    # ~12 checkpoints over 76,250 steps. Required at this budget: no arm finishes inside one
    # scheduler slot, so training resumes via `modalities warmstart` from the most recent one.
    # A 1.1B DCP checkpoint is ~13 GiB (N2_anchor_moe, 2.043B: ~24 GiB); checkpoint_saving.k below
    # keeps only the single most recent, so disk cost is bounded per arm rather than growing with
    # the number of checkpoints taken.
    checkpointing_interval_in_steps: 5000
    evaluation_interval_in_steps: 250
  consistency_enforcement:
    enforce_tokens_per_step_consistency: true
    enforce_last_step_logged: false
    enforce_last_step_evaluated: false
    enforce_last_step_checkpointed: false
  step_profile:
    # 1 accum step x 8 micro batch x 4 replicas (dp_degree) = 32 sequences global -- same global
    # batch as the 557M-token, 1-GPU wave, just spread over 4 GPUs instead of accumulated on one.
    # Micro batch 8 (not smaller + more replicas) on purpose: with 128 experts and top-6, a micro
    # batch of 1 gives ~96 tokens per expert, too few for grouped_mm to be efficient -- confirmed
    # empirically, not just by extrapolation: a debug-queue speed test (section 9 of the research
    # plan, 2026-08-11) measured dp_degree 4 (this config, 1 node) at ~59-63 samples/s for the
    # slowest arm (A2_loop_moe) -- a clean ~4x over the single-GPU baseline -- while dp_degree 16
    # (4 nodes, micro batch 2) measured WORSE, ~38 samples/s: cross-node all-reduce overhead plus
    # thinner per-GPU MoE routing batches outweigh the extra GPUs for a model this size. Scaling
    # past one node is a net loss here; do not increase dp_degree without re-measuring.
    gradient_accumulation_steps: 1
    local_train_micro_batch_size: 8
    sequence_length: 2048
    dp_degree:
      instance_key: dp_degree
      pass_type: BY_REFERENCE
  training_target:
    # LITERAL, NOT DERIVED FROM THE DATASET -- and this is the single most consequential number in
    # the file after the layer pattern, because `lr_scheduler.total_steps` follows it. Fixing the
    # *token* budget (not wall clock) is what keeps arms comparable: they differ in throughput by
    # up to ~1.5x, so equal wall clock would silently turn the comparison into "which arm is
    # fastest" instead of "which arm reaches the lowest loss for the same training".
    #
    # 5B tokens is roughly compute-optimal for this model's 225M active parameters (Chinchilla
    # ~4.5B), against the ~12% of optimal the previous 557M-token wave represented -- see
    # docs/components/nemotron_loops_research_plan.md section 9.3.
    #
    # Running PAST total_steps would be worse than stopping short: torch's CosineAnnealingLR is
    # periodic, so beyond T_max it sends the learning rate back UP. num_target_steps is what stops
    # the trainer, which is why it is pinned here rather than only in the scheduler.
    #
    # num_target_tokens must stay num_target_steps * 65,536 tokens/step (local_train_micro_batch_size
    # x gradient_accumulation_steps x dp_degree x 2048, however that product is split across GPUs --
    # see the step_profile comment above) or `enforce_tokens_per_step_consistency` rejects the
    # config. 76,250 is also a multiple of evaluation_interval_in_steps (250), so the final step is
    # evaluated.
    num_target_tokens: 4997120000
    num_target_steps: 76250
  training_progress:
    global_num_seen_tokens:
      component_key: number_conversion
      variant_key: global_num_seen_tokens_from_checkpoint_path
      config:
        checkpoint_path: ${settings.warmstart_checkpoint_paths.checkpoint_folder_path}
    num_seen_steps:
      component_key: number_conversion
      variant_key: num_seen_steps_from_checkpoint_path
      config:
        checkpoint_path: ${settings.warmstart_checkpoint_paths.checkpoint_folder_path}
    num_seen_samples:
      component_key: number_conversion
      variant_key: num_samples_from_num_tokens
      config:
        num_tokens: ${settings.training_progress.global_num_seen_tokens}
        sequence_length: ${settings.step_profile.sequence_length}
    last_step:
      component_key: number_conversion
      variant_key: last_step_from_checkpoint_path
      config:
        checkpoint_path: ${settings.warmstart_checkpoint_paths.checkpoint_folder_path}
  warmstart_checkpoint_paths: ${warmstart_env:checkpoint_paths}

collate_fn:
  component_key: collate_fn
  variant_key: gpt_2_llm_collator
  config:
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

